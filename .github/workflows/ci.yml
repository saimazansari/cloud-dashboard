name: CI

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Run backend checks
        type: boolean
        default: true
      frontend:
        description: Run frontend checks
        type: boolean
        default: true
      infra:
        description: Run infra checks (Docker, Terraform, nginx)
        type: boolean
        default: true
      security:
        description: Run security audit
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    if: ${{ inputs.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: ./backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Tidy check
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -o /dev/null ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Check for spelling errors
        uses: codespell-project/actions-codespell@v2
        with:
          path: backend/
          check_filenames: false

  frontend:
    name: Frontend
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ./frontend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test deps
        run: pip install pytest

      - name: Test
        run: python -m pytest test_app.py -v

      - name: Load check
        run: python -c "from app import app; print('Flask app loaded OK')"

      - name: Check for spelling errors
        uses: codespell-project/actions-codespell@v2
        with:
          path: frontend/
          check_filenames: false

  infra:
    name: Infra (Docker + Terraform + nginx)
    if: ${{ inputs.infra }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Validate backend Dockerfile
        run: docker build -t cloud-dashboard-backend backend/ --quiet

      - name: Validate frontend Dockerfile
        run: docker build -t cloud-dashboard-frontend frontend/ --quiet

      - name: Validate nginx config syntax
        run: docker run --rm -v $PWD/nginx:/etc/nginx/conf.d nginx:alpine nginx -t

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: ./terraform
        continue-on-error: true

  security:
    name: Security Audit
    if: ${{ inputs.security }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
