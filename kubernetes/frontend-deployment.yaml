apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloud-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cloud-dashboard-frontend:latest
          ports:
            - containerPort: 5000
          env:
            - name: BACKEND_URL
              value: "http://backend:8080"
            - name: SECRET_KEY
              value: "change-this-to-a-secure-random-key"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
